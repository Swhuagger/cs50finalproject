{% extends "layout.html" %}

{% block title %}
    Stock Search
{% endblock %}

{% block main %}
    <form action="/changepass" method="post">
        <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="current" placeholder="Current Password" type="text">
        </div>
        <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="new" placeholder="New Password" type="text">
        </div>
        <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="confirm" placeholder="Confirm New Password" type="text">
        </div>
        <button class="btn btn-primary" type="submit">Search</button>
    </form>
{% endblock %}
